<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SliderSnake - Free Multiplayer Snake Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111116; color: white; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Wyników Gracza */
        #ui { position: absolute; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.6); padding: 12px 18px; border-radius: 8px; pointer-events: none; display: none; z-index: 10; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(4px); }
        #ui h2 { margin: 0 0 4px 0; font-size: 16px; color: #00ff7f; text-transform: uppercase; letter-spacing: 1px; }
        #ui p { margin: 2px 0; font-size: 13px; font-weight: bold; }
        .connected { color: #00ff7f; }
        .disconnected { color: #ff4444; }

        /* PANEL TABELI LIDERÓW (Slither Style) */
        #leaderboard { position: absolute; top: 15px; right: 15px; background: rgba(0, 0, 0, 0.55); padding: 15px; border-radius: 10px; pointer-events: none; display: none; z-index: 10; min-width: 200px; border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(4px); }
        #leaderboard h3 { margin: 0 0 8px 0; font-size: 14px; text-align: center; color: #ffd700; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; }
        .lb-entry { font-size: 12px; font-weight: bold; display: flex; justify-content: space-between; margin: 4px 0; color: rgba(255,255,255,0.8); }
        .lb-me { color: #00ff7f !important; text-shadow: 0 0 5px rgba(0,255,127,0.6); }

        /* Instrukcje Akcji w Rogu */
        #controls-hint { position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.7); padding: 10px 14px; border-radius: 6px; font-size: 11px; z-index: 10; font-weight: bold; display: none; pointer-events: none; border: 1px solid rgba(255,255,255,0.05); line-height: 1.5; }

        /* REPLIKA LOBBY SLITHER.IO */
        #slither-lobby-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #191921 0%, #0c0c0f 100%);
        }
        
        /* POPRAWIONE KOLOROWE LOGO */
        .logo-title {
            font-size: 110px; 
            font-weight: bold; 
            margin: 0 0 35px 0; 
            letter-spacing: -4px;
            background: linear-gradient(135deg, #4fe171 0%, #34a853 40%, #7252db 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent; 
            background-color: transparent !important;
            filter: drop-shadow(0px 5px 15px rgba(0,0,0,0.7));
        }
        
        .slither-input {
            width: 260px; background: #000000; border: 2px solid #444; border-radius: 25px;
            padding: 12px 20px; color: #fff; font-size: 18px; font-weight: 500;
            text-align: center; outline: none; margin-bottom: 18px; transition: border-color 0.2s;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
        }
        .slither-input:focus { border-color: #00ff7f; }

        .slither-play-btn {
            background: #2b6144; color: white; border: 2px solid #3d805b; border-radius: 20px;
            padding: 10px 40px; font-size: 20px; font-weight: bold; cursor: pointer; outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: background 0.2s, transform 0.1s;
        }
        .slither-play-btn:hover { background: #347552; transform: scale(1.04); }

        .bestie-subtext { color: #00ff7f; font-size: 14px; font-weight: bold; margin: 15px 0 0 0; text-shadow: 0 0 8px rgba(0,255,127,0.3); }
        #errorMsg { color: #ff4444; font-size: 13px; margin-top: 8px; font-weight: bold; height: 15px; }

        #skin-corner-btn { position: absolute; bottom: 20px; left: 30px; display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 105; }
        #skin-corner-btn span { color: #52ec87; font-size: 14px; font-weight: bold; margin-top: 5px; text-shadow: 0 2px 4px black; }
        #skinMenu { position: absolute; bottom: 110px; left: 30px; background: rgba(10,10,12,0.95); border: 2px solid #333; padding: 12px; border-radius: 15px; display: none; flex-direction: column; gap: 6px; box-shadow: 0 10px 25px black; z-index: 105; }
        .slither-skin-btn { padding: 8px 16px; background: #18181f; color: white; border: 2px solid #444; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: bold; text-align: left; transition: all 0.2s; }
        .slither-skin-btn:hover { background: #22222a; border-color: #00ff7f; }
    </style>
</head>
<body>

<div id="ui">
    <h2>SliderSnake Arena</h2>
    <p>Score: <span id="score">0</span></p>
    <p>Level: <span id="lvl">1</span></p>
    <p>Status: <span id="status" class="disconnected">Connecting...</span></p>
</div>

<div id="leaderboard">
    <h3>Leaderboard</h3>
    <div id="lb-entries"></div>
</div>

<div id="controls-hint">
    Hold CLICK: Sprint Masy<br>
    Press W: Złóż Jajo (Potomek)<br>
    Press Q: Zostaw Jad (Trucizna)
</div>

<div id="slither-lobby-wrapper">
    <h1 class="logo-title">SliderSnake</h1>
    <input type="text" id="usernameInput" placeholder="Twój Nickname" maxlength="15" class="slither-input">
    <button onclick="startGame()" class="slither-play-btn">Graj Teraz</button>
    <p class="bestie-subtext">Click PLAY to start with your Bestie!</p>
    <p id="errorMsg"></p>

    <div id="skinMenu">
        <button onclick="selectSkin('classic')" class="slither-skin-btn">🟢 Classic</button>
        <button onclick="selectSkin('neon')" class="slither-skin-btn">🔵 Neon Glow</button>
        <button onclick="selectSkin('rainbow')" class="slither-skin-btn">🌈 Rainbow Wave</button>
        <button onclick="selectSkin('gold')" class="slither-skin-btn">👑 Pure Gold</button>
        <button onclick="selectSkin('void')" class="slither-skin-btn">⚫ Void Monster</button>
    </div>

    <div id="skin-corner-btn" onclick="toggleSkinMenu()">
        <canvas id="previewCanvas" width="70" height="50" style="position:static; background:transparent; display:block;"></canvas>
        <span>Wybierz Skórkę</span>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const c = document.getElementById("gameCanvas"), x = c.getContext("2d");
    c.width = innerWidth; c.height = innerHeight;
    
    // Zmienne stanu gry
    let snakes = {}, foods = [], eggs = [], camX = 2500, camY = 2500, myId = null, selectedSkin = "classic", playerName = "", inGame = false;
    let isSprinting = false;
    let previewHue = 0;
    
    // ROZWIĄZANIE PROBLEMU BLACK SCREEN: Flaga kontroli kamery startowej
    let cameraInitialized = false; 

    // Wybudzanie darmowej instancji Rendera zaraz po wejściu na stronę
    const API_URL = window.location.protocol + "//" + window.location.host + "/";
    async function wakeUpServer() {
        try {
            console.log("⏳ Pre-warming serwera...");
            await fetch(API_URL);
            console.log("✅ Serwer aktywny.");
        } catch (e) {
            console.error("Serwer jeszcze się nie wybudził:", e);
        }
    }
    wakeUpServer();

    // Podgląd skórki w rogu ekranu lobby
    const previewCanvas = document.getElementById("previewCanvas"), pCtx = previewCanvas.getContext("2d");
    function drawPreview() {
        pCtx.clearRect(0, 0, 70, 50);
        let cx = 35, cy = 25, radius = 11, r = 40, g = 255, b = 40;
        
        if (selectedSkin === "gold") { r = 255; g = 215; b = 0; }
        if (selectedSkin === "void") { r = 17; g = 17; b = 17; }
        if (selectedSkin === "neon") { r = 0; g = 255; b = 255; }
        if (selectedSkin === "rainbow") {
            pCtx.fillStyle = `hsl(${previewHue}, 100%, 50%)`;
        } else {
            pCtx.fillStyle = `rgb(${r},${g},${b})`;
        }

        pCtx.beginPath(); pCtx.arc(cx, cy, radius, 0, Math.PI * 2); pCtx.fill();
        if (selectedSkin === "void") { pCtx.strokeStyle = "#fff"; pCtx.lineWidth = 2; pCtx.stroke(); }
        
        previewHue = (previewHue + 2) % 360;
        requestAnimationFrame(drawPreview);
    }
    drawPreview();

    function toggleSkinMenu() {
        const m = document.getElementById("skinMenu"); m.style.display = m.style.display === "flex" ? "none" : "flex";
    }

    function selectSkin(s) {
        selectedSkin = s;
        toggleSkinMenu();
    }

    let ws = null, lastSendTime = 0;

    function startGame() {
        const nInput = document.getElementById("usernameInput"), err = document.getElementById("errorMsg");
        let name = nInput.value.trim();
        if (!name) name = "Snake_" + Math.floor(Math.random() * 900 + 100);
        playerName = name; err.innerText = "Łączenie z areną...";

        const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        ws = new WebSocket(protocol + window.location.host + "/ws");

        ws.onopen = () => {
            document.getElementById("status").innerText = "Połączony";
            document.getElementById("status").className = "connected";
            document.getElementById("ui").style.display = "block";
            document.getElementById("leaderboard").style.display = "block";
            document.getElementById("controls-hint").style.display = "block";
            document.getElementById("slither-lobby-wrapper").style.display = "none";
            inGame = true;
            cameraInitialized = false; // Reset kamery przed pierwszym pakietem danych
            
            window.onmousemove = handleMove;
            window.onmousedown = () => { isSprinting = true; handleMove({clientX: lastMouseX, clientY: lastMouseY}); };
            window.onmouseup = () => { isSprinting = false; handleMove({clientX: lastMouseX, clientY: lastMouseY}); };
            window.onkeydown = handleAction;
            
            ws.send(JSON.stringify({ type: "join", name: playerName, skin: selectedSkin }));
            requestAnimationFrame(drawGame);
        };

        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type === "joined") {
                myId = msg.player_id;
            } else if (msg.type === "update") {
                const newSnakes = {};
                msg.snakes.forEach(s => { newSnakes[s.id] = s; });
                snakes = newSnakes;
                foods = msg.foods;
                eggs = msg.eggs;
                
                updateLeaderboard(msg.leaderboard);

                // LOGIKA AUTOMATYCZNEJ SUKCESJI BESTIE
                if (myId && !snakes[myId]) {
                    const successionSnake = Object.values(snakes).find(s => s.isFriend || s.name.includes("Bestie"));
                    if (successionSnake) {
                        myId = successionSnake.id;
                        cameraInitialized = false; // Pozwól kamerze natychmiast przeskoczyć do nowego ciała
                        console.log("👑 Przejęto kontrolę nad sukcesorem Bestie o ID:", myId);
                    }
                }

                if (myId && snakes[myId]) {
                    document.getElementById("score").innerText = snakes[myId].points;
                    document.getElementById("lvl").innerText = snakes[myId].level;
                    
                    // POPRAWKA BLACK SCREEN: Natychmiastowy teleport kamery na pozycję spawnu gracza
                    if (!cameraInitialized) {
                        camX = snakes[myId].x;
                        camY = snakes[myId].y;
                        cameraInitialized = true;
                    }
                }
            }
        };

        ws.onclose = () => {
            document.getElementById("status").innerText = "Rozłączony";
            document.getElementById("status").className = "disconnected";
            document.getElementById("slither-lobby-wrapper").style.display = "flex";
            document.getElementById("ui").style.display = "none";
            document.getElementById("leaderboard").style.display = "none";
            document.getElementById("controls-hint").style.display = "none";
            inGame = false;
            cameraInitialized = false;
            err.innerText = "Połączenie przerwane!";
        };
    }

    let lastMouseX = 0, lastMouseY = 0;
    function handleMove(e) {
        if (!inGame || !myId) return;
        if (e.clientX !== undefined) { lastMouseX = e.clientX; lastMouseY = e.clientY; }
        
        const now = Date.now();
        if (now - lastSendTime < 45) return; 
        lastSendTime = now;

        const targetX = camX + (lastMouseX - innerWidth / 2); 
        const targetY = camY + (lastMouseY - innerHeight / 2);
        
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "move", player_id: myId, targetX: targetX, targetY: targetY, sprint: isSprinting }));
        }
    }

    function handleAction(e) {
        if (!inGame || !myId || !ws || ws.readyState !== WebSocket.OPEN) return;
        const key = e.key.toLowerCase();
        if (key === 'q') {
            ws.send(JSON.stringify({ type: "action", player_id: myId, action: "poison" }));
        } else if (key === 'w') {
            ws.send(JSON.stringify({ type: "action", player_id: myId, action: "egg" }));
        }
    }

    function updateLeaderboard(data) {
        const container = document.getElementById("lb-entries");
        container.innerHTML = "";
        if (!data) return;
        data.forEach((entry, idx) => {
            const div = document.createElement("div");
            const isMe = myId && snakes[myId] && entry.name === snakes[myId].name;
            div.className = "lb-entry" + (isMe ? " lb-me" : "");
            div.innerHTML = "<span>" + (idx+1) + ". " + entry.name + "</span><span>" + entry.score + "</span>";
            container.appendChild(div);
        });
    }

    // Funkcja generująca tło w formie heksagonalnego plastra miodu (Slither Style)
    function drawHexGrid(ctx, cx, cy, w, h) {
        ctx.strokeStyle = "#16161f";
        ctx.lineWidth = 1.5;
        
        const hexRadius = 45; 
        const hexHeight = hexRadius * Math.sqrt(3);
        
        const startCol = Math.floor((cx - w / 2) / (hexRadius * 1.5)) - 1;
        const endCol = Math.ceil((cx + w / 2) / (hexRadius * 1.5)) + 1;
        const startRow = Math.floor((cy - h / 2) / hexHeight) - 1;
        const endRow = Math.ceil((cy + h / 2) / hexHeight) + 1;

        for (let col = startCol; col <= endCol; col++) {
            for (let row = startRow; row <= endRow; row++) {
                let xPos = col * hexRadius * 1.5;
                let yPos = row * hexHeight + (col % 2 === 0 ? 0 : hexHeight / 2);
                
                // Rysuj tylko w granicach mapy 5000x5000
                if (xPos < -50 || xPos > 5050 || yPos < -50 || yPos > 5050) continue;

                ctx.fillStyle = "#1b1b24"; 
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    let angle = (Math.PI / 3) * i;
                    ctx.lineTo(xPos + hexRadius * Math.cos(angle), yPos + hexRadius * Math.sin(angle));
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
        }
    }

    function drawGame() {
        if (!inGame) return;
        
        // Płynna, klatkowa interpolacja kamery (LERP) za pozycją gracza
        if (cameraInitialized && myId && snakes[myId]) {
            const targetPlayer = snakes[myId];
            camX += (targetPlayer.x - camX) * 0.1;
            camY += (targetPlayer.y - camY) * 0.1;
        }
        
        // Czyszczenie i rysowanie tła świata
        x.fillStyle = "#121216"; x.fillRect(0, 0, c.width, c.height);
        
        x.save(); 
        x.translate(c.width / 2 - camX, c.height / 2 - camY);

        // Wywołanie renderowania siatki heksagonalnej plastra miodu
        drawHexGrid(x, camX, camY, c.width, c.height);
        
        // Czerwona krawędź areny
        x.strokeStyle = "#ff3333"; x.lineWidth = 6; x.strokeRect(0, 0, 5000, 5000);

        // Renderowanie jajek
        eggs.forEach(egg => {
            x.fillStyle = "#ffffff";
            x.beginPath(); x.arc(egg.x, egg.y, 8, 0, Math.PI * 2); x.fill();
            x.strokeStyle = "rgba(0, 255, 127, 0.4)"; x.lineWidth = 3; x.stroke();
        });

        // Renderowanie jedzenia (Szybkie i zoptymalizowane gradienty radialne poświaty)
        foods.forEach(f => {
            let radius = f.is_poison ? 7 : 3 + f.value;
            let gradient = x.createRadialGradient(f.x, f.y, 1, f.x, f.y, radius * 2.2);
            
            if (f.is_poison) {
                gradient.addColorStop(0, '#be33ff');
                gradient.addColorStop(0.4, 'rgba(148, 0, 211, 0.8)');
                gradient.addColorStop(1, 'rgba(148, 0, 211, 0)');
            } else {
                let color = f.value > 2 ? "#00ffff" : "#ffdd44";
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.2, color);
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
            }
            
            x.fillStyle = gradient;
            x.beginPath(); x.arc(f.x, f.y, radius * 2.2, 0, Math.PI * 2); x.fill();
        });

        // Pętla renderowania wszystkich węży na arenie
        Object.values(snakes).forEach(s => {
            let baseColor = s.color;
            let isVoid = s.skin === "void";

            if (s.skin === "rainbow") baseColor = "hsl(" + s.hue + ", 100%, 50%)";
            else if (s.skin === "gold") baseColor = "#ffd700";
            else if (isVoid) baseColor = "#111116";

            x.fillStyle = baseColor;

            // Rysowanie segmentów ciała węża (od ogona do głowy)
            s.segments.slice().reverse().forEach((seg, idx) => {
                x.beginPath();
                let realIdx = s.segments.length - 1 - idx;
                const [segmentX, segmentY] = seg;
                
                let radius_seg = realIdx === 0 ? 12 : 9;
                radius_seg += Math.min(12, s.level * 0.35); 
                
                x.arc(segmentX, segmentY, radius_seg, 0, Math.PI * 2);
                x.fill();
                
                if (isVoid) {
                    x.strokeStyle = "#ffffff"; x.lineWidth = 1.5; x.stroke();
                }
            });
            
            // Rysowanie oczu na głowie dla lepszej czytelności kierunku ruchu
            if (s.segments.length > 0) {
                const head = s.segments[0];
                x.fillStyle = "#ffffff";
                x.beginPath(); x.arc(head[0], head[1], 3, 0, Math.PI * 2); x.fill();
            }
            
            // Podpis nicku nad głową węża
            x.fillStyle = s.id === myId ? "#00ff7f" : "rgba(255,255,255,0.75)";
            x.font = "bold 13px Arial"; x.textAlign = "center";
            x.fillText(s.name + " [Lvl " + s.level + "]", s.x, s.y - 24);
        });

        // Kinowa winieta przyciemniająca krawędzie widoku ekranu
        let vignette = x.createRadialGradient(camX, camY, Math.min(c.width, c.height) * 0.4, camX, camY, Math.max(c.width, c.height) * 0.8);
        vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
        vignette.addColorStop(1, 'rgba(5, 5, 8, 0.55)');
        x.fillStyle = vignette;
        x.fillRect(camX - c.width/2, camY - c.height/2, c.width, c.height);

        x.restore(); 
        requestAnimationFrame(drawGame);
    }

    window.onresize = () => { c.width = innerWidth; c.height = innerHeight; };
</script>
</body>
</html>
